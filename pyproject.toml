[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinka"
version = "0.0.1"
description = "Automated Scientific Evolution"
authors = [
    {name = "Sakana AI", email = "robert@sakana.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "anthropic",
    "requests",
    "boto3",
    "pydantic",
    "backoff",
    "python-dotenv",
    "instructor",
    "python-Levenshtein",
    "radon",
    "unidiff",
    "dill",
    "hydra-core==1.3.2",
    "matplotlib",
    "networkx",
    "seaborn",
    "moviepy",
    "scikit-learn",
    "adjustText",
    "markdown",
    "aiofiles",
    "google-generativeai",
    "scipy>=1.16.0",
]

[project.optional-dependencies]
benchmarks = [
    "sympy>=1.13.3",
    "jax>=0.7.2",
    "torch>=2.5.1",
    "numba>=0.61.2",
    "deap>=1.4.3",
    "platypus-opt",
    "scikit-opt>=0.6.6",
    "nevergrad>=1.0.12",
    "optuna>=4.4.0",
    "shapely>=2.1.1",
    "rtree>=1.4.0",
    "python-constraint>=1.4.0",
    "ortools>=9.6.0",
    "cvxpy>=1.7.1",
    "pymunk>=7.1.0",
    "joblib>=1.5.1",
    "cython>=3.1.2",
    "numexpr>=2.10.1",
]

[tool.setuptools]
script-files = ["shinka/shinka_launch", "shinka/shinka_visualize"]

[tool.setuptools.packages.find]
include = ["shinka", "shinka.*"]

[tool.setuptools.package-data]
"*" = ["*"]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black",
    "isort",
    "flake8",
]
