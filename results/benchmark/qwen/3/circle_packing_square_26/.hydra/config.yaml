verbose: false
results_dir: results
run_name: ${now:%Y.%m.%d}${now:%H%M%S}
output_dir: results/benchmark/qwen/3/circle_packing_square_26
db_config:
  _target_: shinka.database.DatabaseConfig
  db_path: evolution_db.sqlite
  num_islands: 10
  archive_size: 250
  elite_selection_ratio: 0.3
  num_archive_inspirations: 2
  num_top_k_inspirations: 2
  migration_interval: 30
  migration_rate: 0.1
  island_elitism: true
  parent_selection_strategy: weighted
  exploitation_alpha: 1.0
  exploitation_ratio: 0.2
  parent_selection_lambda: 10.0
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
  - diff
  - full
  - cross
  patch_type_probs:
  - 0.4
  - 0.4
  - 0.2
  num_generations: 250
  max_parallel_jobs: 10
  max_patch_resamples: 2
  max_patch_attempts: 2
  llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  llm_dynamic_selection: ucb
  llm_kwargs:
    temperatures:
    - 0.7
    max_tokens: 2147483647
  meta_rec_interval: 10
  meta_llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  meta_llm_kwargs:
    temperatures:
    - 0.7
  embedding_model: AZURE_TEXT-EMBEDDING-3-SMALL
  results_dir: ${output_dir}
  task_sys_msg: "\nSETTING:\nYou are an expert computational geometer and optimization\
    \ specialist focusing on circle packing problems.\nYour task is to evolve a constructor\
    \ function that generates an optimal arrangement of exactly 26 non-overlapping\
    \ circles within a unit square [0,1] × [0,1], maximizing the sum of their radii.\n\
    \nPROBLEM CONTEXT:\n- Target: Beat the AlphaEvolve benchmark of sum_radii = 2.6358627564136983\n\
    - Constraint: All circles must be fully contained within the unit square with\
    \ no overlaps\n- Mathematical formulation: For circle i at position (xi, yi) with\
    \ radius ri:\n  * Containment: ri ≤ xi ≤ 1-ri and ri ≤ yi ≤ 1-ri\n  * Non-overlap:\
    \ √[(xi-xj)² + (yi-yj)²] ≥ ri + rj for all i≠j\n  * Objective: maximize Σri subject\
    \ to above constraints\n\nCOMPUTATIONAL BUDGET:\n- **Time limit**: 60 seconds\
    \ maximum execution time\n- **Memory limit**: 1 GB\n\nCOMPUTATIONAL RESOURCES\
    \ & IMPLEMENTATION GUIDELINES:\n**Core packages**: numpy, scipy, sympy, pandas,\
    \ networkx, jax, torch, numba, scikit-learn\n\n**Additional useful packages**:\n\
    - **Optimization**: `deap` (evolutionary algorithms), `platypus` (multi-objective\
    \ optimization)\n- **Geometric computing**: `shapely` (geometric operations),\
    \ `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)\n- **Constraint\
    \ programming**: `python-constraint`, `ortools` (Google OR-Tools)\n- **Physics\
    \ simulation**: `pymunk` (2D physics), `pybullet` (physics engine)\n- **Performance**:\
    \ `cython`, `joblib` (parallelization)\n\nPERFORMANCE METRICS:\n1. **sum_radii**:\
    \ Total sum of all 26 circle radii (PRIMARY OBJECTIVE - maximize)\n2. **benchmark_ratio**:\
    \ sum_radii / 2.6358627564136983 (progress toward beating benchmark)  \n3. **eval_time**:\
    \ Execution time in seconds (keep reasonable, prefer accuracy over speed)\n\n\
    TECHNICAL REQUIREMENTS:\n- **Determinism**: Use fixed random seeds if employing\
    \ stochastic methods for reproducibility\n- **Error handling**: Graceful handling\
    \ of optimization failures or infeasible configurations\n- **Memory efficiency**:\
    \ Avoid excessive memory allocation for distance matrix computations\n- **Scalability**:\
    \ Design with potential extension to different circle counts in mind\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/packing_problems/circle_packing_square/26/init_program.py
  job_type: local
  seed: 45
evaluate_function:
  _target_: problems.alphaevolve_math_problems.packing_problems.circle_packing_square.26.evaluate.main
  program_path: ???
  results_dir: ???
distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
  - cuda/12.4
  - cudnn/8.9.7
  - hpcx/2.20
  eval_program_path: shinka/eval_hydra.py
  conda_env: shinka
  time: 00:01:00
  cpus: 10
  gpus: 0
  mem: 1G
exp_name: shinka_circle_packing_square_26
job_config:
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: ${distributed_job_config.eval_program_path}
variant_suffix: _qwen
