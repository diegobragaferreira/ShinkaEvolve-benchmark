verbose: false
results_dir: results
run_name: ${now:%Y.%m.%d}${now:%H%M%S}
output_dir: results/benchmark/qwen/3/circle_packing_rect_21
db_config:
  _target_: shinka.database.DatabaseConfig
  db_path: evolution_db.sqlite
  num_islands: 10
  archive_size: 300
  elite_selection_ratio: 0.3
  num_archive_inspirations: 2
  num_top_k_inspirations: 2
  migration_interval: 40
  migration_rate: 0.1
  island_elitism: true
  parent_selection_strategy: weighted
  exploitation_alpha: 1.0
  exploitation_ratio: 0.2
  parent_selection_lambda: 10.0
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
  - diff
  - full
  - cross
  patch_type_probs:
  - 0.4
  - 0.4
  - 0.2
  num_generations: 300
  max_parallel_jobs: 10
  max_patch_resamples: 2
  max_patch_attempts: 2
  llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  llm_dynamic_selection: ucb
  llm_kwargs:
    temperatures:
    - 0.7
    max_tokens: 2147483647
  meta_rec_interval: 10
  meta_llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  meta_llm_kwargs:
    temperatures:
    - 0.7
  embedding_model: AZURE_TEXT-EMBEDDING-3-SMALL
  results_dir: ${output_dir}
  task_sys_msg: "\nSETTING:\nYou are an expert computational geometer and optimization\
    \ specialist with deep expertise in circle packing problems, geometric optimization\
    \ algorithms, and constraint satisfaction.\nYour mission is to evolve and optimize\
    \ a constructor function that generates an optimal arrangement of exactly 21 non-overlapping\
    \ circles within a rectangle, maximizing the sum of their radii.\n\nPROBLEM CONTEXT:\n\
    - **Objective**: Create a function that returns optimal (x, y, radius) coordinates\
    \ for 21 circles\n- **Benchmark**: Beat the AlphaEvolve state-of-the-art result\
    \ of sum_radii = 2.3658321334167627\n- **Container**: Rectangle with perimeter\
    \ = 4 (width + height = 2). You may choose optimal width/height ratio\n- **Constraints**:\
    \ \n  * All circles must be fully contained within rectangle boundaries\n  * No\
    \ circle overlaps (distance between centers ≥ sum of their radii)\n  * Exactly\
    \ 21 circles required\n  * All radii must be positive\n\nCOMPUTATIONAL BUDGET:\n\
    - **Time limit**: 60 seconds maximum execution time\n- **Memory limit**: 1 GB\n\
    \nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core packages**: numpy,\
    \ scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\n**Additional\
    \ useful packages**:\n- **Global optimization**: `deap` (evolutionary computation),\
    \ `platypus` (NSGA-II)\n- **Metaheuristics**: `scikit-opt` (PSO, GA, SA), `nevergrad`\
    \ (gradient-free optimization), `optuna` (hyperparameter optimization)\n- **Geometric\
    \ computing**: `shapely` (geometric operations), `rtree` (spatial indexing), `scipy.spatial`\
    \ (distance matrices, Voronoi)\n- **Constraint programming**: `python-constraint`,\
    \ `ortools` (Google OR-Tools), `cvxpy` (convex optimization)\n- **Physics engines**:\
    \ `pymunk` (2D rigid body physics), `Box2D` (collision detection)\n- **Parallel\
    \ computing**: `joblib` (embarrassingly parallel), `multiprocessing`, `concurrent.futures`\n\
    - **Performance**: `cython` (C extensions), `numexpr` (fast numerical expressions)\n\
    \nPERFORMANCE METRICS:\n1. **sum_radii**: Total sum of all 21 circle radii (PRIMARY\
    \ OBJECTIVE - maximize)\n2. **benchmark_ratio**: sum_radii / 2.3658321334167627\
    \ (progress toward beating benchmark)  \n3. **eval_time**: Execution time in seconds\
    \ (keep reasonable, prefer accuracy over speed)\n\nTECHNICAL REQUIREMENTS:\n-\
    \ **Determinism**: Use fixed random seeds if employing stochastic methods for\
    \ reproducibility\n- **Error handling**: Graceful handling of optimization failures\
    \ or infeasible configurations\n- **Memory efficiency**: Avoid excessive memory\
    \ allocation for distance matrix computations\n- **Scalability**: Design with\
    \ potential extension to different circle counts in mind\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/packing_problems/circle_packing_rect/21/init_program.py
  job_type: local
  seed: 45
evaluate_function:
  _target_: problems.alphaevolve_math_problems.packing_problems.circle_packing_rect.21.evaluate.main
  program_path: ???
  results_dir: ???
distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
  - cuda/12.4
  - cudnn/8.9.7
  - hpcx/2.20
  eval_program_path: shinka/eval_hydra.py
  conda_env: shinka
  time: 00:01:00
  cpus: 10
  gpus: 0
  mem: 1G
exp_name: shinka_circle_packing_rect_21
job_config:
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: ${distributed_job_config.eval_program_path}
variant_suffix: _qwen
