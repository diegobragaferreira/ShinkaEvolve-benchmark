  results_dir: ${output_dir}
  task_sys_msg: "You are an expert in additive combinatorics, functional analysis,\
    \ and optimization with deep expertise in autocorrelation inequalities, step function\
    \ constructions, and constraint satisfaction problems.\nYour mission is to evolve\
    \ and optimize a function that discovers step function constructions to improve\
    \ the upper bound on the first autocorrelation inequality constant C₁, which arises\
    \ in the study of Sidon sets.\n\nPROBLEM CONTEXT:\n- **Objective**: Find a sequence\
    \ of non-negative real numbers (representing heights of equal-width steps) that\
    \ maximizes 1/C₁ (equivalently, minimizes C₁)\n- **Benchmark**: Beat the current\
    \ state-of-the-art with 1/C₁ > 1/1.5031 ≈ 0.6653 (equivalently C₁ < 1.5031)\n\
    - **Known bounds**: 1.28 ≤ C₁ ≤ 1.5098, so 0.6654 ≤ 1/C₁ ≤ 0.7813\n- **Mathematical\
    \ formulation**: For a step function with n steps of heights a = [a₁, a₂, ...,\
    \ aₙ], compute the convolution b = a * a, then C₁ = 2n · max(b) / (sum(a))², and\
    \ we maximize 1/C₁\n- **Constraints**:\n  * All step heights must be non-negative\n\
    \  * At least one height must be positive (sum > 0.01)\n  * Practical limits:\
    \ heights clipped to [0, 1000]\n  * Sequence length n can vary\nCOMPUTATIONAL\
    \ RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core packages**: numpy, scipy, sympy,\
    \ pandas, networkx, jax, torch, numba, scikit-learn\n\n**Additional useful packages**:\n\
    - **Global optimization**: `deap` (evolutionary algorithms), `platypus` (multi-objective\
    \ optimization), `pymoo` (evolutionary computation)\n- **Metaheuristics**: `scikit-opt`\
    \ (PSO, GA, SA, DE), `nevergrad` (gradient-free optimization), `optuna` (Bayesian\
    \ optimization)\n- **Convex optimization**: `cvxpy` (disciplined convex programming),\
    \ `scipy.optimize` (linprog, minimize)\n- **Signal processing**: `scipy.signal`\
    \ (convolution operations), `scipy.fft` (fast convolution via FFT)\n- **Parallel\
    \ computing**: `joblib` (parallel loops), `multiprocessing`, `concurrent.futures`,\
    \ `ray` (distributed computing)\n- **Performance**: `numba` (@jit compilation),\
    \ `cython`, `numexpr` (fast array operations)\n\nPERFORMANCE METRICS:\n1. **inv_c1**:\
    \ 1/C₁ value (PRIMARY OBJECTIVE - maximize this, higher means better upper bound)\n\
    2. **benchmark_ratio**: 1.5031/C₁ (success indicator - values > 1.0 mean you've\
    \ beaten the benchmark)\n3. **eval_time**: Execution time in seconds (keep reasonable)\n\
    \nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use fixed random seeds for reproducibility\
    \ across runs\n- **Robustness**: Handle edge cases (empty sequences, all zeros,\
    \ numerical instability)\n- **Memory efficiency**: Use FFT-based convolution for\
    \ large sequences (O(n log n) vs O(n²))\n- **Scalability**: Consider that optimal\
    \ n may vary; explore different sequence lengths\n- **Numerical stability**: Be\
    \ mindful of division by small sums; evaluator rejects sum(a) < 0.01\n\nMATHEMATICAL\
    \ INSIGHTS:\n- The autoconvolution b[k] = Σᵢ a[i] · a[k-i] is central to the problem\n\
    - To maximize 1/C₁ = (sum(a))² / (2n · max(b)), we want to minimize the ratio\
    \ max(b)/(sum(a))² while accounting for sequence length n\n- This means: maximize\
    \ total mass sum(a) relative to peak convolution max(b), while keeping n small\n\
    - The trade-off between sequence length n and height distribution is crucial\n\
    \nCOMPUTATIONAL BUDGET:\n- **Time limit**: 180 seconds maximum execution time\n\
    - **Memory limit**: 5 GB\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/autocorrelation_problems/first_autocorr_ineq/init_program.py
