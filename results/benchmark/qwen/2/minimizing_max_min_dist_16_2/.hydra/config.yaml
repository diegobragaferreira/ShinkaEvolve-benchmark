verbose: false
results_dir: results
run_name: ${now:%Y.%m.%d}${now:%H%M%S}
output_dir: results/benchmark/qwen/2/minimizing_max_min_dist_16_2
db_config:
  _target_: shinka.database.DatabaseConfig
  db_path: evolution_db.sqlite
  num_islands: 10
  archive_size: 300
  elite_selection_ratio: 0.3
  num_archive_inspirations: 3
  num_top_k_inspirations: 3
  migration_interval: 40
  migration_rate: 0.1
  island_elitism: true
  parent_selection_strategy: weighted
  exploitation_alpha: 1.0
  exploitation_ratio: 0.2
  parent_selection_lambda: 10.0
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
  - diff
  - full
  - cross
  patch_type_probs:
  - 0.4
  - 0.4
  - 0.2
  num_generations: 300
  max_parallel_jobs: 10
  max_patch_resamples: 3
  max_patch_attempts: 3
  llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  llm_dynamic_selection: ucb
  llm_kwargs:
    temperatures:
    - 0.7
    max_tokens: 2147483647
  meta_rec_interval: 10
  meta_llm_models:
  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  meta_llm_kwargs:
    temperatures:
    - 0.7
  embedding_model: AZURE_TEXT-EMBEDDING-3-SMALL
  results_dir: ${output_dir}
  task_sys_msg: "\nSETTING:\nYou are an expert computational geometer and optimization\
    \ specialist focusing on point dispersion problems.\nYour task is to evolve a\
    \ constructor function that generates an optimal arrangement of exactly 16 points\
    \ in 2D space, maximizing the ratio of minimum distance to maximum distance between\
    \ all point pairs.\n\nPROBLEM CONTEXT:\n- Target: Beat the AlphaEvolve benchmark\
    \ of min/max ratio = 1/√12.889266112 ≈ 0.2786\n- Constraint: Points must be placed\
    \ in 2D Euclidean space (typically normalized to unit square [0,1] × [0,1])\n\
    - Mathematical formulation: For points Pi = (xi, yi), i = 1,...,16:\n  * Distance\
    \ matrix: dij = √[(xi-xj)² + (yi-yj)²] for all i≠j\n  * Minimum distance: dmin\
    \ = min{dij : i≠j}\n  * Maximum distance: dmax = max{dij : i≠j}\n  * Objective:\
    \ maximize dmin/dmax subject to spatial constraints\n\nPERFORMANCE METRICS:\n\
    1. **min_max_ratio**: dmin/dmax ratio (PRIMARY OBJECTIVE - maximize)\n2. **benchmark_ratio**:\
    \ min_max_ratio / 0.2786 (progress toward beating AlphaEvolve benchmark)\n3. **eval_time**:\
    \ Execution time in seconds (balance accuracy vs. efficiency)\n\nCOMPUTATIONAL\
    \ RESOURCES:\n**Core packages**: numpy, scipy, sympy, pandas\n**Additional useful\
    \ packages**:\n- **3D optimization**: `scipy.optimize`, `deap`, `platypus`, `pymoo`\
    \ (multi-objective)\n- **3D geometric computing**: \n  * `scipy.spatial` (3D distance\
    \ matrices, ConvexHull, SphericalVoronoi)\n  * `trimesh` (3D mesh operations),\
    \ `open3d` (3D data processing)\n- **Specialized 3D algorithms**: \n  * `spherical-geometry`\
    \ for spherical arrangements\n  * `quaternion` package for 3D rotations\n- **Performance**:\
    \ `numba` (3D JIT compilation), `joblib`\n\nTECHNICAL REQUIREMENTS:\n- **Reproducibility**:\
    \ Fixed random seeds for all stochastic components\n\nCOMPUTATIONAL BUDGET:\n\
    - **Time limit**: 180 seconds maximum execution time\n- **Memory limit**: 5 GB\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/minimizing_max_min_dist/2/init_program.py
  job_type: local
  seed: 44
evaluate_function:
  _target_: problems.alphaevolve_math_problems.minimizing_max_min_dist.2.evaluate.main
  program_path: ???
  results_dir: ???
distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
  - cuda/12.4
  - cudnn/8.9.7
  - hpcx/2.20
  eval_program_path: shinka/eval_hydra.py
  conda_env: shinka
  time: 00:03:00
  cpus: 10
  gpus: 0
  mem: 1G
exp_name: shinka_minimizing_max_min_dist_16_2
job_config:
  _target_: shinka.launch.LocalJobConfig
  eval_program_path: ${distributed_job_config.eval_program_path}
variant_suffix: _qwen
