  - AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  meta_llm_kwargs:
    temperatures:
    - 0.7
  embedding_model: AZURE_TEXT-EMBEDDING-3-SMALL
  results_dir: ${output_dir}
  task_sys_msg: "\nSETTING:\nYou are an expert in harmonic analysis, functional inequalities,\
    \ and optimization with deep expertise in autoconvolution norms, step function\
    \ constructions, and numerical integration methods.\nYour mission is to evolve\
    \ and optimize a function that discovers step function constructions to improve\
    \ the lower bound on the second autocorrelation inequality constant C₂.\n\nPROBLEM\
    \ CONTEXT:\n- **Objective**: Find a sequence of non-negative real numbers (representing\
    \ heights of equally-spaced steps on [-1/4, 1/4]) that maximizes C₂\n- **Benchmark**:\
    \ Beat AlphaEvolve's result of C₂ = 0.962\n- **Known bounds**: 0.88922 ≤ C₂ ≤\
    \ 1 (theoretical upper bound is 1)\n- **Mathematical formulation**: For step function\
    \ f with autoconvolution g = f*f, we have C₂ = ||g||₂² / (||g||₁ · ||g||∞)\n-\
    \ **Norms computed on autoconvolution**:\n  * ||g||₂²: L2-norm squared, computed\
    \ via piecewise linear integration over convolution\n  * ||g||₁: L1-norm, approximated\
    \ as sum(|g|) / (len(g) + 1)\n  * ||g||∞: Infinity-norm, computed as max(|g|)\n\
    - **Constraints**:\n  * All step heights must be non-negative (negative values\
    \ clipped to 0)\n  * Sequence length n can vary (AlphaEvolve used 50,000; you\
    \ may explore different ranges)\n  * Steps are equally-spaced on the interval\
    \ [-1/4, 1/4]\n\nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core\
    \ packages**: numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\
    \n**Additional useful packages**:\n- **Global optimization**: `deap` (evolutionary\
    \ algorithms), `platypus` (multi-objective optimization), `pymoo` (evolutionary\
    \ computation)\n- **Metaheuristics**: `scikit-opt` (PSO, GA, SA, DE), `nevergrad`\
    \ (gradient-free optimization), `optuna` (Bayesian optimization)\n- **Signal processing**:\
    \ `scipy.signal` (convolution operations), `scipy.fft` (fast convolution via FFT)\n\
    - **Numerical integration**: `scipy.integrate` (quadrature methods), though evaluator\
    \ uses trapezoidal-like piecewise linear integration\n- **Parallel computing**:\
    \ `joblib` (parallel loops), `multiprocessing`, `concurrent.futures`, `ray` (distributed\
    \ computing)\n- **Performance**: `numba` (@jit compilation for loops), `cython`,\
    \ `numexpr` (fast array operations)\n- **Sparse representations**: `scipy.sparse`\
    \ (if exploiting sparsity in step functions)\n\nPERFORMANCE METRICS:\n1. **c2**:\
    \ C₂ value (PRIMARY OBJECTIVE - maximize this)\n2. **benchmark_ratio**: c2 / 0.962\
    \ (success indicator - values > 1.0 mean you've beaten AlphaEvolve)\n3. **eval_time**:\
    \ Execution time in seconds \n\nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use\
    \ fixed random seeds for reproducibility across runs\n- **Robustness**: Handle\
    \ edge cases (empty sequences, all zeros, numerical instability in norm computations)\n\
    - **Numerical stability**: Be mindful of divisions when ||g||₁ or ||g||∞ are small\n\
    \nMATHEMATICAL INSIGHTS:\n- The autoconvolution g[k] = Σᵢ f[i] · f[k-i] is the\
    \ central object\n- C₂ = ||g||₂² / (||g||₁ · ||g||∞) measures the relationship\
    \ between different norms of g\n- To maximize C₂, we want ||g||₂² to be large\
    \ relative to the product ||g||₁ · ||g||∞\n- Higher peak values in g (large ||g||∞)\
    \ tend to decrease C₂ unless ||g||₂² grows even faster\n- More uniform distributions\
    \ in g (flatter profiles) tend to increase the ratio ||g||₂² / (||g||₁ · ||g||∞)\n\
    - The piecewise linear integration method for ||g||₂² uses trapezoidal rule: for\
    \ interval with heights y₁, y₂ and width h, contribution is (h/3)(y₁² + y₁y₂ +\
    \ y₂²)\n\nCOMPUTATIONAL BUDGET:\n- **Time limit**: 90 seconds maximum execution\
    \ time\n- **Memory limit**: 5 GB\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/autocorrelation_problems/second_autocorr_ineq/init_program.py
  job_type: local
  seed: 44
