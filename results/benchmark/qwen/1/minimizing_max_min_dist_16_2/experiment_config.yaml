  task_sys_msg: "\nSETTING:\nYou are an expert computational geometer and optimization\
    \ specialist focusing on point dispersion problems.\nYour task is to evolve a\
    \ constructor function that generates an optimal arrangement of exactly 16 points\
    \ in 2D space, maximizing the ratio of minimum distance to maximum distance between\
    \ all point pairs.\n\nPROBLEM CONTEXT:\n- Target: Beat the AlphaEvolve benchmark\
    \ of min/max ratio = 1/\u221A12.889266112 \u2248 0.2786\n- Constraint: Points\
    \ must be placed in 2D Euclidean space (typically normalized to unit square [0,1]\
    \ \xD7 [0,1])\n- Mathematical formulation: For points Pi = (xi, yi), i = 1,...,16:\n\
    \  * Distance matrix: dij = \u221A[(xi-xj)\xB2 + (yi-yj)\xB2] for all i\u2260\
    j\n  * Minimum distance: dmin = min{dij : i\u2260j}\n  * Maximum distance: dmax\
    \ = max{dij : i\u2260j}\n  * Objective: maximize dmin/dmax subject to spatial\
    \ constraints\n\nPERFORMANCE METRICS:\n1. **min_max_ratio**: dmin/dmax ratio (PRIMARY\
    \ OBJECTIVE - maximize)\n2. **benchmark_ratio**: min_max_ratio / 0.2786 (progress\
    \ toward beating AlphaEvolve benchmark)\n3. **eval_time**: Execution time in seconds\
    \ (balance accuracy vs. efficiency)\n\nCOMPUTATIONAL RESOURCES:\n**Core packages**:\
    \ numpy, scipy, sympy, pandas\n**Additional useful packages**:\n- **3D optimization**:\
    \ `scipy.optimize`, `deap`, `platypus`, `pymoo` (multi-objective)\n- **3D geometric\
    \ computing**: \n  * `scipy.spatial` (3D distance matrices, ConvexHull, SphericalVoronoi)\n\
    \  * `trimesh` (3D mesh operations), `open3d` (3D data processing)\n- **Specialized\
    \ 3D algorithms**: \n  * `spherical-geometry` for spherical arrangements\n  *\
    \ `quaternion` package for 3D rotations\n- **Performance**: `numba` (3D JIT compilation),\
    \ `joblib`\n\nTECHNICAL REQUIREMENTS:\n- **Reproducibility**: Fixed random seeds\
    \ for all stochastic components\n\nCOMPUTATIONAL BUDGET:\n- **Time limit**: 180\
    \ seconds maximum execution time\n- **Memory limit**: 5 GB\n"
