evo_config:
  task_sys_msg: "SETTING:\nYou are an expert in high-dimensional geometry, lattice\
    \ theory, and combinatorial optimization, specializing in sphere packing and coding\
    \ theory problems.\nYour task is to devise a computational strategy and generate\
    \ a set of points that provides a new state-of-the-art lower bound for a specific\
    \ variant of the kissing number problem in 11 dimensions.\n\nPROBLEM CONTEXT:\n\
    Your goal is to find the largest possible set of points $S \\subset \\mathbb{Z}^{11}$\
    \ (points with 11 integer coordinates) that satisfies the following geometric\
    \ constraint: the maximum L2 norm of any point from the origin must be less than\
    \ or equal to the minimum pairwise L2 distance between any two distinct points\
    \ in the set.\n\n- **Target**: Beat the AlphaEvolve benchmark of **num_points\
    \ = 593**.\n- **Constraint**: For the set of points $S = \\{p_1, p_2, ..., p_k\\\
    }$ where $p_i \\in \\mathbb{Z}^{11}$:\n  $$\\max_{i} \\|p_i\\|_2 \\le \\min_{i\
    \ \\neq j} \\|p_i - p_j\\|_2$$\n- **Objective**: Maximize the cardinality of the\
    \ set, $k = |S|$.\n\nPERFORMANCE METRICS:\n1.  **num_points**: The number of points\
    \ in the final set $S$. **This is the primary objective to maximize.**\n2.  **benchmark_ratio**:\
    \ Your `num_points` / 593. The goal is to achieve a ratio > 1.0.\n3.  **eval_time**:\
    \ The total wall-clock time in seconds to generate the solution.\n\nCOMPUTATIONAL\
    \ BUDGET:\n- **Time limit**: 360 seconds maximum execution time\n- **Memory limit**:\
    \ 5 GB\n\nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core packages**:\
    \ numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n**Additional\
    \ useful packages**:\n- **Optimization**: `deap` (evolutionary algorithms), `platypus`\
    \ (multi-objective optimization)\n- **Geometric computing**: `shapely` (geometric\
    \ operations), `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)\n\
    - **Constraint programming**: `python-constraint`, `ortools` (Google OR-Tools)\n\
    - **Physics simulation**: `pymunk` (2D physics), `pybullet` (physics engine)\n\
    - **Performance**: `cython`, `joblib` (parallelization), 'numba' (JIT)\n\nTECHNICAL\
    \ REQUIREMENTS:\n- **Determinism & Reproducibility**: Your solution must be fully\
    \ reproducible. If you use any stochastic algorithms (like simulated annealing\
    \ or genetic algorithms), you **must use a fixed random seed** (e.g., `numpy.random.seed(42)`).\n\
    - **Efficiency**: While secondary to correctness and the number of points, your\
    \ algorithm should be reasonably efficient. Avoid brute-force searches over the\
    \ entire $\\mathbb{Z}^{11}$ lattice, which is computationally infeasible.\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/kissing_number/init_program.py
  job_type: slurm_conda
exp_name: shinka_kissing_number
