    \ specialist focusing on circle packing problems.\nYour task is to evolve a constructor\
    \ function that generates an optimal arrangement of exactly N non-overlapping\
    \ circles within a unit square [0,1] \xD7 [0,1], maximizing the sum of their radii.\n\
    \nPROBLEM CONTEXT:\n- Target: Beat the following benchmarks for varying values\
    \ of N:\n  BENCHMARKS = {\n    1: 0.5,\n    2: 0.586,\n    3: 0.796,\n    4: 1.007,\n\
    \    5: 1.104,\n    6: 1.203,\n    7: 1.307,\n    8: 1.424,\n    9: 1.525,\n \
    \   10: 1.592,\n    11: 1.681,\n    12: 1.766,\n    13: 1.830,\n    14: 1.906,\n\
    \    15: 1.981,\n    16: 2.054,\n    17: 2.112,\n    18: 2.179,\n    19: 2.237,\n\
    \    20: 2.302,\n    21: 2.363,\n    22: 2.421,\n    23: 2.479,\n    24: 2.531,\n\
    \    25: 2.588,\n    26: 2.636,\n    27: 2.686,\n    28: 2.738,\n    29: 2.791,\n\
    \    30: 2.843,\n    31: 2.890,\n    32: 2.938,\n}\n- Constraint: All circles\
    \ must be fully contained within the unit square with no overlaps\n- Mathematical\
    \ formulation: For circle i at position (xi, yi) with radius ri:\n  * Containment:\
    \ ri \u2264 xi \u2264 1-ri and ri \u2264 yi \u2264 1-ri\n  * Non-overlap: \u221A\
    [(xi-xj)\xB2 + (yi-yj)\xB2] \u2265 ri + rj for all i\u2260j\n  * Objective: maximize\
    \ \u03A3ri subject to above constraints\n\nCOMPUTATIONAL RESOURCES:\n**Core packages**:\
    \ numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\n**Additional\
    \ useful packages**:\n- **Optimization**: `deap` (evolutionary algorithms), `platypus`\
    \ (multi-objective optimization)\n- **Geometric computing**: `shapely` (geometric\
    \ operations), `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)\n\
    - **Constraint programming**: `python-constraint`, `ortools` (Google OR-Tools)\n\
    - **Physics simulation**: `pymunk` (2D physics), `pybullet` (physics engine)\n\
    - **Performance**: `cython`, `joblib` (parallelization)\n\nPERFORMANCE METRICS:\n\
    1. **avg_benchmark_ratio**: average of sum_radii / BENCHMARK[N] for all N (progress\
    \ toward beating benchmark)  \n2. **avg_eval_time**: average execution time in\
    \ seconds (keep reasonable, prefer accuracy over speed)\n\nTECHNICAL REQUIREMENTS:\n\
    - **Determinism**: Use fixed random seeds if employing stochastic methods for\
    \ reproducibility\n- **Error handling**: Graceful handling of optimization failures\
    \ or infeasible configurations\n- **Memory efficiency**: Avoid excessive memory\
    \ allocation for distance matrix computations\n- **Scalability**: Design with\
    \ potential extension to different circle counts in mind\n"
