evo_config:
  task_sys_msg: "SETTING:\nYou are an expert in harmonic analysis, functional inequalities,\
    \ and optimization with deep expertise in autoconvolution bounds, step function\
    \ constructions, and global optimization methods.\nYour mission is to evolve and\
    \ optimize a function that discovers step function constructions to improve the\
    \ upper bound on the third autocorrelation inequality constant C\u2083.\n\nPROBLEM\
    \ CONTEXT:\n- **Objective**: Find a sequence of real numbers (representing heights\
    \ of equally-spaced steps on [-1/4, 1/4]) that minimizes C\u2083\n- **Benchmark**:\
    \ Beat AlphaEvolve's result of C\u2083 = 1.4556\n- **Known bounds**: C\u2083 \u2264\
    \ 1.4581 (Vinuesa 2009), improved by AlphaEvolve to C\u2083 \u2264 1.4556\n- **Mathematical\
    \ formulation**: For step function f with autoconvolution g = f*f, we have C\u2083\
    \ = 2n \xB7 max(g) / (sum(f))\xB2\n- **Constraints**:\n  * f values can be positive,\
    \ negative, or zero\n  * Sum of f values must not be too close to zero (evaluator\
    \ rejects |sum(f)|\xB2 < 1e-12)\n  * Sequence length n can vary\n  * Steps are\
    \ equally-spaced on the interval [-1/4, 1/4]\n\nCOMPUTATIONAL BUDGET:\n- **Time\
    \ limit**: 360 seconds maximum execution time\n- **Memory limit**: 1 GB\n- For\
    \ n steps, convolution produces 2n-1 points; memory scales as O(n)\n\n**Additional\
    \ useful packages**:\n- **Global optimization**: `deap` (evolutionary algorithms),\
    \ `platypus` (multi-objective optimization), `pymoo` (evolutionary computation)\n\
    - **Metaheuristics**: `scikit-opt` (PSO, GA, SA, DE), `nevergrad` (gradient-free\
    \ optimization), `optuna` (Bayesian optimization)\n- **Signal processing**: `scipy.signal`\
    \ (convolution operations), `scipy.fft` (fast convolution via FFT)\n- **Convex\
    \ optimization**: `cvxpy` (disciplined convex programming), `scipy.optimize` (various\
    \ optimizers)\n- **Parallel computing**: `joblib` (parallel loops), `multiprocessing`,\
    \ `concurrent.futures`, `ray` (distributed computing)\n- **Performance**: `numba`\
    \ (@jit compilation for loops), `cython`, `numexpr` (fast array operations)\n\n\
    PERFORMANCE METRICS:\n1. **inv_c3**: 1/C\u2083 value (MAXIMIZE - higher means\
    \ lower C\u2083, which is better)\n2. **benchmark_ratio**: 1.4556 / C\u2083 (success\
    \ indicator - values > 1.0 mean you've beaten AlphaEvolve)\n3. **eval_time**:\
    \ Execution time in seconds\n\nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use\
    \ fixed random seeds for reproducibility across runs\n- **Robustness**: Handle\
    \ edge cases (empty sequences, sum near zero, numerical instability)\n- **Memory\
    \ efficiency**: Use FFT-based convolution for fast computation\n- **Numerical\
    \ stability**: Be mindful of divisions when sum(f) is small; evaluator rejects\
    \ |sum(f)|\xB2 < 1e-12\n- **Scalability**: While AlphaEvolve used n=400, explore\
    \ whether smaller or larger n gives better results\n"
  language: python
  init_program_path: problems/alphaevolve_math_problems/autocorrelation_problems/third_autocorr_ineq/init_program.py
  job_type: slurm_conda
exp_name: shinka_third_autocorr_ineq
