    \nPROBLEM CONTEXT:\n- Target: Beat the AlphaEvolve benchmark of sum_radii = 2.937944526205518\n\
    - Constraint: All circles must be fully contained within the unit square with\
    \ no overlaps\n- Mathematical formulation: For circle i at position (xi, yi) with\
    \ radius ri:\n  * Containment: ri \u2264 xi \u2264 1-ri and ri \u2264 yi \u2264\
    \ 1-ri\n  * Non-overlap: \u221A[(xi-xj)\xB2 + (yi-yj)\xB2] \u2265 ri + rj for\
    \ all i\u2260j\n  * Objective: maximize \u03A3ri subject to above constraints\n\
    \nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core packages**: numpy,\
    \ scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\n**Additional\
    \ useful packages**:\n- **Optimization**: `deap` (evolutionary algorithms), `platypus`\
    \ (multi-objective optimization)\n- **Geometric computing**: `shapely` (geometric\
    \ operations), `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)\n\
    - **Constraint programming**: `python-constraint`, `ortools` (Google OR-Tools)\n\
    - **Physics simulation**: `pymunk` (2D physics), `pybullet` (physics engine)\n\
    - **Performance**: `cython`, `joblib` (parallelization)\n\nPERFORMANCE METRICS:\n\
    1. **sum_radii**: Total sum of all 32 circle radii (PRIMARY OBJECTIVE - maximize)\n\
    2. **benchmark_ratio**: sum_radii / 2.937944526205518 (progress toward beating\
    \ benchmark)  \n3. **eval_time**: Execution time in seconds (keep reasonable,\
    \ prefer accuracy over speed)\n\nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use\
    \ fixed random seeds if employing stochastic methods for reproducibility\n- **Error\
    \ handling**: Graceful handling of optimization failures or infeasible configurations\n\
    - **Memory efficiency**: Avoid excessive memory allocation for distance matrix\
    \ computations\n- **Scalability**: Design with potential extension to different\
    \ circle counts in mind\n"
